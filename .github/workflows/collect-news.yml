
name: Collect Daily News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news
        run: python engine/collect_news.py

      - name: Save news to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily news data"
            git push
          else
            echo "No changes to news data"
          fi

      - name: Upload news data
        uses: actions/upload-artifact@v4
        with:
          name: daily-news
          path: data/news_data.json
