def clean_url(url):
    """Remove tracking parameters to reduce duplicate articles."""
    try:
        parsed = urlparse(url)
        return urlunparse((
            parsed.scheme,
            parsed.netloc,
            parsed.path,
            "",
            "",
            ""
        ))
    except Exception:
        return url


def collect_news():
    articles = []
    failed_sources = []

    print("THE INTELLIGENCE ROOM")
    print("Starting multi-category news collection...\n")

    for feed in FEEDS:
        print("Collecting:", feed["name"])

        try:
            result = feedparser.parse(feed["url"])

            if result.bozo and not result.entries:
                failed_sources.append(feed["name"])
                print("Feed unavailable.")
                continue

            for entry in result.entries[:12]:
                link = clean_url(entry.get("link", ""))

                if not link:
                    continue

                article = {
                    "source": feed["name"],
                    "title": entry.get("title", ""),
                    "link": link,
                    "published": entry.get("published", ""),
                    "summary": entry.get("summary", ""),
                    "categories": feed["categories"],
                    "analysis_status": "Pending"
                }

                articles.append(article)

            time.sleep(0.2)

        except Exception as error:
            failed_sources.append(feed["name"])
            print("Error:", error)

    # Remove duplicate links
    unique_articles = {}

    for article in articles:
        link = article["link"]

        if link not in unique_articles:
            unique_articles[link] = article
        else:
            existing = unique_articles[link]
            existing["categories"] = sorted(set(
                existing["categories"] + article["categories"]
            ))

            existing["source"] += " | " + article["source"]

    final_articles = list(unique_articles.values())

    # Count stories by category
    category_counts = {}

    for article in final_articles:
        for category in article["categories"]:
            category_counts[category] = (
                category_counts.get(category, 0) + 1
            )

    output = {
        "publication": "The Intelligence Room",
        "collected_at": datetime.now(timezone.utc).isoformat(),
        "total_articles": len(final_articles),
        "total_sources": len(FEEDS),
        "failed_sources": failed_sources,
        "category_counts": category_counts,
        "articles": final_articles
    }

    with open("news_data.json", "w", encoding="utf-8") as file:
        json.dump(output, file, indent=2, ensure_ascii=False)

    print("\nCOLLECTION COMPLETE")
    print("Articles collected:", len(final_articles))
    print("\nCATEGORY BREAKDOWN:")

    for category, count in sorted(category_counts.items()):
        print(category + ":", count)

    print("\nFailed sources:", failed_sources)


if __name__ == "__main__":
    collect_news()

